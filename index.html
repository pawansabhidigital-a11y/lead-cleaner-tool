<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabhi Digital - Lead Cleaner & Batcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">🚀 Lead Cleaner, VLOOKUP & Batching Tool</h1>
        <p class="text-gray-600 mb-6">Master sheet aur Exclusion (L3) list upload karein. Column select karein aur har Tag ke liye alag alag Excel files download karein!</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center">
                <label class="block font-semibold text-gray-700 mb-2">1. Master Sheet (Excel / CSV)</label>
                <input type="file" id="masterFile" accept=".xlsx, .xls, .csv" onchange="handleMasterUpload()" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center">
                <label class="block font-semibold text-gray-700 mb-2">2. Exclusion / L3 Sheet (Optional)</label>
                <input type="file" id="exclusionFile" accept=".xlsx, .xls, .csv" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
            </div>
        </div>

        <div class="mb-6">
            <label class="block font-semibold text-gray-700 mb-2">Batch Size per Tag (Default: 2000)</label>
            <input type="number" id="batchSize" value="2000" class="w-full md:w-1/3 border border-gray-300 rounded-lg p-2">
        </div>

        <!-- Column Selection Section -->
        <div id="columnSelectionContainer" class="mb-6 hidden bg-gray-50 p-4 rounded-xl border border-gray-200">
            <label class="block font-semibold text-gray-800 mb-2">Select Columns to Export (Jo columns aapko chahiye unhe tick karein):</label>
            <div class="flex gap-2 mb-3">
                <button type="button" onclick="selectAllCols(true)" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded font-semibold hover:bg-blue-200">Select All</button>
                <button type="button" onclick="selectAllCols(false)" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded font-semibold hover:bg-gray-300">Deselect All</button>
            </div>
            <div id="columnsCheckboxList" class="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-48 overflow-y-auto bg-white p-3 border rounded-lg">
                <!-- Checkboxes will appear dynamically -->
            </div>
        </div>

        <button onclick="processLeads()" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-700 transition duration-200 shadow-md">
            ⚡ Process Leads & Generate Separate Files
        </button>

        <div id="status" class="mt-4 text-center font-medium text-gray-700"></div>
        <div id="downloadLinks" class="mt-6 space-y-2"></div>
    </div>

    <script>
        let masterColumns = [];
        let globalMasterData = [];

        function readFileAsJSON(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    resolve(json);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function handleMasterUpload() {
            const masterInput = document.getElementById('masterFile').files[0];
            if (!masterInput) return;
            try {
                globalMasterData = await readFileAsJSON(masterInput);
                if (globalMasterData.length > 0) {
                    masterColumns = Object.keys(globalMasterData[0]);
                    
                    // Add automatic generated columns if not present
                    if (!masterColumns.includes('Formatted Number')) masterColumns.push('Formatted Number');
                    if (!masterColumns.includes('WhatsApp Number')) masterColumns.push('WhatsApp Number');
                    if (!masterColumns.includes('Tag')) masterColumns.push('Tag');

                    const container = document.getElementById('columnsCheckboxList');
                    container.innerHTML = '';
                    masterColumns.forEach(col => {
                        let div = document.createElement('div');
                        div.className = 'flex items-center space-x-2';
                        div.innerHTML = `<input type="checkbox" value="${col}" checked class="col-checkbox rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                                         <span class="text-sm text-gray-700 truncate" title="${col}">${col}</span>`;
                        container.appendChild(div);
                    });
                    document.getElementById('columnSelectionContainer').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function selectAllCols(status) {
            document.querySelectorAll('.col-checkbox').forEach(cb => cb.checked = status);
        }

        async function processLeads() {
            const masterInput = document.getElementById('masterFile').files[0];
            const exclusionInput = document.getElementById('exclusionFile').files[0];
            const batchSize = parseInt(document.getElementById('batchSize').value) || 2000;
            const statusDiv = document.getElementById('status');
            const downloadDiv = document.getElementById('downloadLinks');
            downloadDiv.innerHTML = '';

            if (!masterInput) {
                alert("Please upload the Master Sheet!");
                return;
            }

            statusDiv.innerHTML = "⏳ Processing leads, please wait...";

            try {
                let exclusionSet = new Set();
                if (exclusionInput) {
                    const exclusionData = await readFileAsJSON(exclusionInput);
                    exclusionData.forEach(row => {
                        for (let key in row) {
                            if (key.toLowerCase().includes('mobile') || key.toLowerCase().includes('phone') || key.toLowerCase().includes('number')) {
                                let val = String(row[key]).replace(/\D/g, '').slice(-10);
                                if (val) exclusionSet.add(val);
                            }
                        }
                    });
                }

                // Find mobile column in master
                let mobileKey = null;
                if (globalMasterData.length > 0) {
                    for (let key in globalMasterData[0]) {
                        if (key.toLowerCase().includes('mobile') || key.toLowerCase().includes('phone') || key.toLowerCase().includes('number')) {
                            mobileKey = key;
                            break;
                        }
                    }
                }

                if (!mobileKey) {
                    alert("Could not find mobile number column in Master Sheet!");
                    statusDiv.innerHTML = "";
                    return;
                }

                // Get selected columns
                const selectedCheckboxes = document.querySelectorAll('.col-checkbox:checked');
                let selectedCols = Array.from(selectedCheckboxes).map(cb => cb.value);

                let processedRows = [];
                let batchCount = 1;
                let currentBatchSize = 0;

                globalMasterData.forEach(row => {
                    let rawMob = String(row[mobileKey] || '').replace(/\D/g, '');
                    let tenDigit = rawMob.slice(-10);

                    if (tenDigit && !exclusionSet.has(tenDigit)) {
                        if (currentBatchSize >= batchSize) {
                            batchCount++;
                            currentBatchSize = 0;
                        }
                        
                        let newRow = { ...row };
                        newRow['Formatted Number'] = tenDigit;
                        newRow['WhatsApp Number'] = "91" + tenDigit;
                        newRow['Tag'] = `Tag-${batchCount}`;

                        processedRows.push(newRow);
                        currentBatchSize++;
                    }
                });

                statusDiv.innerHTML = `✅ Success! Processed ${processedRows.length} leads into ${batchCount} batches. Download separate files below:`;

                // Generate separate Excel files for All Cleaned and each Tag
                let filesToDownload = [];

                // 1. All Cleaned Leads file
                let allCleanedFiltered = processedRows.map(row => {
                    let filtered = {};
                    selectedCols.forEach(col => filtered[col] = row[col] !== undefined ? row[col] : '');
                    return filtered;
                });
                
                let wbAll = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wbAll, XLSX.utils.json_to_sheet(allCleanedFiltered), "All_Cleaned_Leads");
                let wbAllOut = XLSX.write(wbAll, {bookType:'xlsx', type:'array'});
                filesToDownload.push({ name: 'All_Cleaned_Leads.xlsx', data: wbAllOut });

                // 2. Individual Tag files
                for (let i = 1; i <= batchCount; i++) {
                    let tagRows = processedRows.filter(r => r['Tag'] === `Tag-${i}`);
                    let tagFiltered = tagRows.map(row => {
                        let filtered = {};
                        selectedCols.forEach(col => filtered[col] = row[col] !== undefined ? row[col] : '');
                        return filtered;
                    });

                    let wbTag = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wbTag, XLSX.utils.json_to_sheet(tagFiltered), `Tag-${i}`);
                    let wbTagOut = XLSX.write(wbTag, {bookType:'xlsx', type:'array'});
                    filesToDownload.push({ name: `Tag-${i}_Leads.xlsx`, data: wbTagOut });
                }

                // Render download buttons for each file
                filesToDownload.forEach(fileObj => {
                    let blob = new Blob([fileObj.data], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
                    let url = URL.createObjectURL(blob);
                    
                    let btn = document.createElement('div');
                    btn.className = "flex items-center justify-between bg-blue-50 border border-blue-200 p-3 rounded-xl";
                    btn.innerHTML = `<span class="font-semibold text-blue-900">${fileObj.name}</span>
                                     <a href="${url}" download="${fileObj.name}" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition">📥 Download File</a>`;
                    downloadDiv.appendChild(btn);
                });

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
