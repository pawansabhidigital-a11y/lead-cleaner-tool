<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabhi Digital - Lead Cleaner & Batcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">🚀 Advanced Lead Cleaner (Mobile + Email Check)</h1>
        <p class="text-gray-600 mb-6">Master sheet, L3 Exclusion sheet, aur Red Leads/DND sheet upload karein. Tool mobile aur email dono se cross-check karke clean files dega!</p>

        <!-- File Uploads Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center bg-blue-50/30">
                <label class="block font-semibold text-gray-700 mb-2 text-sm">1. Master Sheet</label>
                <input type="file" id="masterFile" accept=".xlsx, .xls, .csv" onchange="handleMasterUpload()" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center bg-red-50/30">
                <label class="block font-semibold text-gray-700 mb-2 text-sm">2. Exclusion / L3 Sheet (Opt.)</label>
                <input type="file" id="exclusionFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-100 file:text-red-700 hover:file:bg-red-200">
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center bg-orange-50/30">
                <label class="block font-semibold text-gray-700 mb-2 text-sm">3. Red Leads / DND Sheet (Opt.)</label>
                <input type="file" id="redLeadsFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200">
            </div>
        </div>

        <!-- Settings Grid: Batch Size & Date Filter -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">Batch Size per Tag</label>
                <input type="number" id="batchSize" value="2000" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">From Date (Optional)</label>
                <input type="date" id="fromDate" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">To Date (Optional)</label>
                <input type="date" id="toDate" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
            </div>
        </div>

        <!-- Column Selection Section -->
        <div id="columnSelectionContainer" class="mb-6 hidden bg-gray-50 p-4 rounded-xl border border-gray-200">
            <label class="block font-semibold text-gray-800 mb-2 text-sm">Select Columns to Export:</label>
            <div class="flex gap-2 mb-3">
                <button type="button" onclick="selectAllCols(true)" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded font-semibold hover:bg-blue-200">Select All</button>
                <button type="button" onclick="selectAllCols(false)" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded font-semibold hover:bg-gray-300">Deselect All</button>
            </div>
            <div id="columnsCheckboxList" class="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-48 overflow-y-auto bg-white p-3 border rounded-lg text-sm">
                <!-- Checkboxes will appear dynamically -->
            </div>
        </div>

        <button onclick="processLeads()" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-700 transition duration-200 shadow-md">
            ⚡ Process Leads (Mobile + Email Check)
        </button>

        <div id="status" class="mt-4 text-center font-medium text-gray-700"></div>
        <div id="downloadLinks" class="mt-6 space-y-2"></div>
    </div>

    <script>
        let masterColumns = [];
        let globalMasterData = [];

        function readFileAsJSON(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    resolve(json);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function handleMasterUpload() {
            const masterInput = document.getElementById('masterFile').files[0];
            if (!masterInput) return;
            try {
                globalMasterData = await readFileAsJSON(masterInput);
                if (globalMasterData.length > 0) {
                    masterColumns = Object.keys(globalMasterData[0]);
                    
                    if (!masterColumns.includes('Formatted Number')) masterColumns.push('Formatted Number');
                    if (!masterColumns.includes('WhatsApp Number')) masterColumns.push('WhatsApp Number');
                    if (!masterColumns.includes('Tag')) masterColumns.push('Tag');

                    const container = document.getElementById('columnsCheckboxList');
                    container.innerHTML = '';
                    masterColumns.forEach(col => {
                        let div = document.createElement('div');
                        div.className = 'flex items-center space-x-2';
                        div.innerHTML = `<input type="checkbox" value="${col}" checked class="col-checkbox rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                                         <span class="text-sm text-gray-700 truncate" title="${col}">${col}</span>`;
                        container.appendChild(div);
                    });
                    document.getElementById('columnSelectionContainer').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function selectAllCols(status) {
            document.querySelectorAll('.col-checkbox').forEach(cb => cb.checked = status);
        }

        // Helper to extract both Mobile sets and Email sets for exclusion
        async function getExclusionData(fileInput) {
            let excMobiles = new Set();
            let excEmails = new Set();
            if (!fileInput) return { excMobiles, excEmails };
            
            const data = await readFileAsJSON(fileInput);
            data.forEach(row => {
                for (let key in row) {
                    let kLower = key.toLowerCase();
                    let val = String(row[key] || '').trim();
                    if (!val) continue;

                    if (kLower.includes('mobile') || kLower.includes('phone') || kLower.includes('number')) {
                        let cleanMob = val.replace(/\D/g, '').slice(-10);
                        if (cleanMob) excMobiles.add(cleanMob);
                    }
                    if (kLower.includes('email') || kLower.includes('mail')) {
                        let cleanEmail = val.toLowerCase();
                        excEmails.add(cleanEmail);
                    }
                }
            });
            return { excMobiles, excEmails };
        }

        function parseExcelDate(val) {
            if (!val) return null;
            if (typeof val === 'number') {
                return new Date(Math.round((val - (25567 + 2)) * 86400 * 1000));
            }
            let d = new Date(val);
            return isNaN(d.getTime()) ? null : d;
        }

        async function processLeads() {
            const masterInput = document.getElementById('masterFile').files[0];
            const exclusionInput = document.getElementById('exclusionFile').files[0];
            const redLeadsInput = document.getElementById('redLeadsFile').files[0];
            const batchSize = parseInt(document.getElementById('batchSize').value) || 2000;
            
            const fromDateVal = document.getElementById('fromDate').value;
            const toDateVal = document.getElementById('toDate').value;
            const fromDate = fromDateVal ? new Date(fromDateVal) : null;
            const toDate = toDateVal ? new Date(toDateVal) : null;
            if (toDate) toDate.setHours(23, 59, 59, 999);

            const statusDiv = document.getElementById('status');
            const downloadDiv = document.getElementById('downloadLinks');
            downloadDiv.innerHTML = '';

            if (!masterInput) {
                alert("Please upload the Master Sheet!");
                return;
            }

            statusDiv.innerHTML = "⏳ Processing leads with Mobile & Email dual-check...";

            try {
                const l3Data = await getExclusionData(exclusionInput);
                const redData = await getExclusionData(redLeadsInput);

                // Combine L3 and Red leads into unified exclusion sets
                let globalExcludedMobiles = new Set([...l3Data.excMobiles, ...redData.excMobiles]);
                let globalExcludedEmails = new Set([...l3Data.excEmails, ...redData.excEmails]);

                let mobileKey = null;
                let emailKey = null;
                let dateKey = null;

                if (globalMasterData.length > 0) {
                    for (let key in globalMasterData[0]) {
                        let kLower = key.toLowerCase();
                        if (!mobileKey && (kLower.includes('mobile') || kLower.includes('phone') || kLower.includes('number'))) {
                            mobileKey = key;
                        }
                        if (!emailKey && (kLower.includes('email') || kLower.includes('mail'))) {
                            emailKey = key;
                        }
                        if (!dateKey && (kLower.includes('date') || kLower.includes('time') || kLower.includes('created'))) {
                            dateKey = key;
                        }
                    }
                }

                if (!mobileKey) {
                    alert("Could not find mobile number column in Master Sheet!");
                    statusDiv.innerHTML = "";
                    return;
                }

                const selectedCheckboxes = document.querySelectorAll('.col-checkbox:checked');
                let selectedCols = Array.from(selectedCheckboxes).map(cb => cb.value);

                let processedRows = [];
                let batchCount = 1;
                let currentBatchSize = 0;

                globalMasterData.forEach(row => {
                    let rawMob = String(row[mobileKey] || '').replace(/\D/g, '');
                    let tenDigit = rawMob.slice(-10);
                    let rowEmail = emailKey ? String(row[emailKey] || '').trim().toLowerCase() : '';

                    if (tenDigit) {
                        // Check exclusion by EITHER Mobile OR Email
                        let isExcludedByMobile = tenDigit && globalExcludedMobiles.has(tenDigit);
                        let isExcludedByEmail = rowEmail && globalExcludedEmails.has(rowEmail);

                        if (!isExcludedByMobile && !isExcludedByEmail) {
                            let passDateFilter = true;
                            if ((fromDate || toDate) && dateKey) {
                                let rowDate = parseExcelDate(row[dateKey]);
                                if (rowDate) {
                                    if (fromDate && rowDate < fromDate) passDateFilter = false;
                                    if (toDate && rowDate > toDate) passDateFilter = false;
                                }
                            }

                            if (passDateFilter) {
                                if (currentBatchSize >= batchSize) {
                                    batchCount++;
                                    currentBatchSize = 0;
                                }
                                
                                let newRow = { ...row };
                                newRow['Formatted Number'] = tenDigit;
                                newRow['WhatsApp Number'] = "91" + tenDigit;
                                newRow['Tag'] = `Tag-${batchCount}`;

                                processedRows.push(newRow);
                                currentBatchSize++;
                            }
                        }
                    }
                });

                statusDiv.innerHTML = `✅ Success! Processed ${processedRows.length} valid leads into ${batchCount} batches. Download files below:`;

                let filesToDownload = [];

                let allCleanedFiltered = processedRows.map(row => {
                    let filtered = {};
                    selectedCols.forEach(col => filtered[col] = row[col] !== undefined ? row[col] : '');
                    return filtered;
                });
                
                let wbAll = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wbAll, XLSX.utils.json_to_sheet(allCleanedFiltered), "All_Cleaned_Leads");
                filesToDownload.push({ name: 'All_Cleaned_Leads.xlsx', data: XLSX.write(wbAll, {bookType:'xlsx', type:'array'}) });

                for (let i = 1; i <= batchCount; i++) {
                    let tagRows = processedRows.filter(r => r['Tag'] === `Tag-${i}`);
                    let tagFiltered = tagRows.map(row => {
                        let filtered = {};
                        selectedCols.forEach(col => filtered[col] = row[col] !== undefined ? row[col] : '');
                        return filtered;
                    });

                    let wbTag = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wbTag, XLSX.utils.json_to_sheet(tagFiltered), `Tag-${i}`);
                    filesToDownload.push({ name: `Tag-${i}_Leads.xlsx`, data: XLSX.write(wbTag, {bookType:'xlsx', type:'array'}) });
                }

                filesToDownload.forEach(fileObj => {
                    let blob = new Blob([fileObj.data], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
                    let url = URL.createObjectURL(blob);
                    
                    let btn = document.createElement('div');
                    btn.className = "flex items-center justify-between bg-blue-50 border border-blue-200 p-3 rounded-xl";
                    btn.innerHTML = `<span class="font-semibold text-blue-900 text-sm">${fileObj.name}</span>
                                     <a href="${url}" download="${fileObj.name}" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 transition">📥 Download File</a>`;
                    downloadDiv.appendChild(btn);
                });

            } catch (error) {
                console.error(error);
                status_div.innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
