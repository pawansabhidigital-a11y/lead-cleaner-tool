<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabhi Digital - Lead Cleaner & Batcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">🚀 Lead Cleaner, VLOOKUP & Batching Tool</h1>
        <p class="text-gray-600 mb-6">Master sheet aur Exclusion (L3) list upload karein. Tool automatically L3 remove karke 2,000 ke batches (Tag-1, Tag-2...) bana dega!</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center">
                <label class="block font-semibold text-gray-700 mb-2">1. Master Sheet (Excel / CSV)</label>
                <input type="file" id="masterFile" accept=".xlsx, .xls, .csv" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center">
                <label class="block font-semibold text-gray-700 mb-2">2. Exclusion / L3 Sheet (Optional)</label>
                <input type="file" id="exclusionFile" accept=".xlsx, .xls, .csv" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
            </div>
        </div>

        <div class="mb-6">
            <label class="block font-semibold text-gray-700 mb-2">Batch Size per Tag (Default: 2000)</label>
            <input type="number" id="batchSize" value="2000" class="w-full md:w-1/3 border border-gray-300 rounded-lg p-2">
        </div>

        <button onclick="processLeads()" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-700 transition duration-200 shadow-md">
            ⚡ Process Leads & Download Excel
        </button>

        <div id="status" class="mt-4 text-center font-medium text-gray-700"></div>
    </div>

    <script>
        function readFileAsJSON(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    resolve(json);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function processLeads() {
            const masterInput = document.getElementById('masterFile').files[0];
            const exclusionInput = document.getElementById('exclusionFile').files[0];
            const batchSize = parseInt(document.getElementById('batchSize').value) || 2000;
            const statusDiv = document.getElementById('status');

            if (!masterInput) {
                alert("Please upload the Master Sheet!");
                return;
            }

            statusDiv.innerHTML = "⏳ Processing leads, please wait...";

            try {
                const masterData = await readFileAsJSON(masterInput);
                let exclusionSet = new Set();

                if (exclusionInput) {
                    const exclusionData = await readFileAsJSON(exclusionInput);
                    exclusionData.forEach(row => {
                        for (let key in row) {
                            if (key.toLowerCase().includes('mobile') || key.toLowerCase().includes('phone') || key.toLowerCase().includes('number')) {
                                let val = String(row[key]).replace(/\D/g, '').slice(-10);
                                if (val) exclusionSet.add(val);
                            }
                        }
                    });
                }

                // Find mobile column in master
                let mobileKey = null;
                if (masterData.length > 0) {
                    for (let key in masterData[0]) {
                        if (key.toLowerCase().includes('mobile') || key.toLowerCase().includes('phone') || key.toLowerCase().includes('number')) {
                            mobileKey = key;
                            break;
                        }
                    }
                }

                if (!mobileKey) {
                    alert("Could not find mobile number column in Master Sheet!");
                    statusDiv.innerHTML = "";
                    return;
                }

                let processedRows = [];
                let batchCount = 1;
                let currentBatchSize = 0;

                masterData.forEach(row => {
                    let rawMob = String(row[mobileKey]).replace(/\D/g, '');
                    let tenDigit = rawMob.slice(-10);

                    if (tenDigit && !exclusionSet.has(tenDigit)) {
                        if (currentBatchSize >= batchSize) {
                            batchCount++;
                            currentBatchSize = 0;
                        }
                        
                        let newRow = { ...row };
                        newRow['Formatted Number'] = tenDigit;
                        newRow['WhatsApp Number'] = "91" + tenDigit;
                        newRow['Tag'] = `Tag-${batchCount}`;

                        processedRows.push(newRow);
                        currentBatchSize++;
                    }
                });

                // Create final Excel workbook with multiple sheets
                let newWB = XLSX.utils.book_new();
                let allSheetWS = XLSX.utils.json_to_sheet(processedRows);
                XLSX.utils.book_append_sheet(newWB, allSheetWS, "All_Cleaned_Leads");

                // Split by Tag sheets
                for (let i = 1; i <= batchCount; i++) {
                    let tagRows = processedRows.filter(r => r['Tag'] === `Tag-${i}`);
                    let tagWS = XLSX.utils.json_to_sheet(tagRows);
                    XLSX.utils.book_append_sheet(newWB, tagWS, `Tag-${i}`);
                }

                XLSX.writeFile(newWB, "Processed_Leads_With_Tags.xlsx");
                statusDiv.innerHTML = `✅ Success! Processed ${processedRows.length} leads into ${batchCount} batches. File downloaded automatically!`;

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
